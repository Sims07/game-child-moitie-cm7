<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17162c"><title>CM7 – Le sortilège des moitiés</title>
<style>
:root{color-scheme:dark;--ink:#fff5db;--muted:#d1c9e3;--gold:#f5ce7d;--panel:#2a2542;--line:#66587e;--green:#a5e7c0}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#49355f 0%,#1d1934 53%,#101323 100%);color:var(--ink);font:600 16px system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;min-height:44px;border:1px solid var(--line);border-radius:13px;background:#382e51;padding:10px 14px}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:default}h1,h2,p{margin:0}h1,h2{font-family:Georgia,serif;color:var(--gold);line-height:1.15}h1{font-size:clamp(26px,6.5vw,40px)}h2{font-size:clamp(22px,5.5vw,32px)}.shell{max-width:760px;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.tag{font-size:12px;letter-spacing:.12em;color:var(--gold)}.stat{font-size:14px;color:var(--gold);white-space:nowrap}.hero{text-align:center;padding:12px 0 7px}.crest{width:84px;height:84px;margin:0 auto 10px;display:grid;place-items:center;border:1px solid #97794e;border-radius:50%;font-size:43px;background:radial-gradient(circle,#765687,#2c2344 72%);box-shadow:0 0 35px #d4a94b26}.sub{color:var(--muted);font-size:14px;line-height:1.45;margin-top:8px}.menu{display:grid;gap:10px}.mission{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;text-align:left;min-height:82px;padding:12px;background:linear-gradient(120deg,#322745,#25233c);border-color:#675577}.mission .symbol{font-size:30px;text-align:center}.mission b{display:block;font-size:17px;color:var(--gold);margin-bottom:4px}.mission small{display:block;font-size:13px;color:var(--muted);line-height:1.35}.arrow{color:var(--gold);font-size:22px}.panel{background:#27223be8;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;box-shadow:0 12px 32px #0003}.record{color:var(--muted);font-size:13px;text-align:center}.primary{background:linear-gradient(120deg,#e8bc63,#f7db91);color:#241931;border:0;font-weight:800;box-shadow:0 4px 0 #9f713c}.wide{width:100%}.meter{height:8px;background:#151527;border-radius:8px;overflow:hidden}.meter span{height:100%;display:block;background:linear-gradient(90deg,#bb94ee,#f5ce7d);transition:width .2s}.question{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;min-height:142px}.question .prompt{font-size:19px;color:var(--muted)}.number{font-size:clamp(48px,13vw,80px);font-weight:800;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}.story{font-size:clamp(17px,4.5vw,23px);line-height:1.45;max-width:460px}.answer{display:flex;justify-content:center;align-items:center;gap:8px;font-size:32px;min-height:52px;letter-spacing:2px;color:var(--gold);font-variant-numeric:tabular-nums}.answer-box{min-width:94px;border-bottom:2px solid var(--gold);padding:0 12px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{font-size:25px;font-weight:800;min-height:52px;padding:5px}.keypad .primary{font-size:21px}.feedback{min-height:44px;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:14px;line-height:1.3}.good{color:var(--green)}.retry{color:#ffda9d}.hint{font-size:14px;min-height:44px}.cauldrons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.cauldron{border:2px solid #78658e;border-radius:14px 14px 28px 28px;background:#211c35;padding:9px 6px;min-height:104px}.cauldron b{color:var(--gold);display:block;font-size:12px;margin-bottom:6px}.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:125px;margin:auto}.dots i{width:13px;height:13px;border-radius:50%;background:#d4a3f8;box-shadow:0 0 6px #d4a3f8aa;justify-self:center}.controls{display:flex;gap:8px}.controls button{flex:1}.small{font-size:13px;color:var(--muted)}.result-stars{font-size:40px;margin:10px 0}.result-score{font-size:42px;color:var(--gold);font-weight:800;margin:6px 0}.review{margin:12px 0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.review span{border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:14px}.lessonpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.lessonpick button{padding:5px;min-height:44px}.lessonpick button[aria-pressed=true]{background:var(--gold);color:#231b31}.reveal{font-size:26px;color:var(--gold);min-height:34px}.badge-line{color:var(--green);font-size:14px;margin-top:8px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
@media(min-width:600px){.menu{grid-template-columns:1fr 1fr}.shell{padding:18px}.keypad{max-width:440px;width:100%;margin:auto}}
@media(max-height:530px) and (orientation:landscape){.shell{gap:6px;padding:6px 10px;max-width:900px}.hero{padding:0}.crest{display:none}.menu{grid-template-columns:1fr 1fr;gap:7px}.mission{min-height:67px;padding:7px}.gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.question{min-height:90px}.number{font-size:48px}.panel{padding:9px}.keypad button{min-height:44px;font-size:22px}.feedback{min-height:32px}.answer{min-height:37px;font-size:26px}.bar{min-height:44px}.lessonpick{grid-template-columns:repeat(10,1fr)}.sub{margin-top:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="shell" id="app"></main>
<script>
'use strict';
const app=document.getElementById('app'), all=Array.from({length:20},(_,i)=>2*(i+1)), storage='cm7-moitie-v1';
let saved={xp:0,best:0,errors:{}};
try{const raw=JSON.parse(localStorage.getItem(storage)||'null');if(raw&&typeof raw==='object'){saved.xp=Number.isFinite(raw.xp)?Math.max(0,raw.xp):0;saved.best=Number.isFinite(raw.best)?Math.max(0,raw.best):0;saved.errors=raw.errors&&typeof raw.errors==='object'?raw.errors:{}}}catch{}
function store(){try{localStorage.setItem(storage,JSON.stringify(saved))}catch{}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const modes={practice:{title:'Le grimoire',count:10},timed:{title:'Défi des 60 secondes'},story:{title:'Les énigmes',count:6}};
const stories=[['Tu as {n} cristaux. Tu les partages entre deux sorcières. Combien chacune reçoit-elle ?','cristaux'],['Le hibou apporte {n} pièces d’or. Deux élèves se les partagent équitablement. Combien chacun en reçoit-il ?','pièces'],['Tu verses {n} gouttes de potion à parts égales dans deux flacons. Combien de gouttes par flacon ?','gouttes'],['Il y a {n} étoiles magiques à répartir entre deux grimoires. Combien dans chaque grimoire ?','étoiles'],['Deux dragons se partagent {n} biscuits. Combien chaque dragon en reçoit-il ?','biscuits'],['Tu répartis {n} plumes magiques dans deux boîtes, en quantités égales. Combien par boîte ?','plumes']];
let state=null,timer=null,advance=null,lessonN=12,shown=false,view='home';
function stop(){clearInterval(timer);clearTimeout(advance);timer=null;advance=null}
function rank(){return saved.xp>=500?'Maîtresse des sortilèges':saved.xp>=200?'Enchanteresse':saved.xp>=80?'Sorcière confirmée':'Apprentie sorcière'}
function bar(title){return '<div class="bar"><button id="home" aria-label="Retour aux épreuves">‹ Épreuves</button><span class="tag">'+title+'</span><span class="stat">✦ '+saved.xp+'</span></div>'}
function wireHome(){document.getElementById('home').onclick=home}
function home(){stop();state=null;view='home';app.innerHTML='<div class="bar"><span class="tag">ACADÉMIE MAGIQUE · CM7</span><span class="stat">✦ '+saved.xp+' points</span></div><header class="hero"><div class="crest" aria-hidden="true">🪄</div><h1>Le sortilège<br>des moitiés</h1><p class="sub">Partage la magie en deux parts égales.<br>De 2 à 40 · CE2</p></header><div class="menu"><button class="mission" data-mode="lesson"><span class="symbol">⚗️</span><span><b>Le cours de potions</b><small>Observe deux parts égales.</small></span><span class="arrow">›</span></button><button class="mission" data-mode="practice"><span class="symbol">📖</span><span><b>Le grimoire des moitiés</b><small>10 calculs à ton rythme.</small></span><span class="arrow">›</span></button><button class="mission" data-mode="timed"><span class="symbol">⏳</span><span><b>Le défi des 60 secondes</b><small>Combien de sorts en 1 minute ?</small></span><span class="arrow">›</span></button><button class="mission" data-mode="story"><span class="symbol">🔮</span><span><b>Les énigmes de la sorcière</b><small>6 histoires de partage.</small></span><span class="arrow">›</span></button></div><div class="panel record">🏅 '+rank()+' · Record chrono : '+saved.best+'</div>';app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>b.dataset.mode==='lesson'?lesson():start(b.dataset.mode))}
function dots(n){return '<div class="dots" aria-hidden="true">'+Array.from({length:n},()=>'<i></i>').join('')+'</div>'}
function cauldrons(n){return '<div class="cauldrons" aria-label="Deux groupes de '+n/2+' ingrédients"><div class="cauldron"><b>Chaudron 1</b>'+dots(n/2)+'</div><div class="cauldron"><b>Chaudron 2</b>'+dots(n/2)+'</div></div>'}
function lesson(){stop();view='lesson';app.innerHTML=bar('COURS DE POTIONS')+'<section class="panel"><h2>Deux parts égales</h2><p class="sub">Choisis un nombre, puis observe les deux chaudrons.</p><div class="question" style="min-height:80px"><span class="number">'+lessonN+'</span><span class="small">ingrédients au total</span></div>'+cauldrons(lessonN)+'<div class="reveal" aria-live="polite">'+(shown?lessonN+' = '+lessonN/2+' + '+lessonN/2:'Combien dans chaque ?')+'</div><button class="primary wide" id="reveal">'+(shown?'Moitié suivante ›':'Révéler le sort')+'</button></section><div class="lessonpick">'+all.map(n=>'<button data-n="'+n+'" aria-pressed="'+(n===lessonN)+'">'+n+'</button>').join('')+'</div>';wireHome();app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{lessonN=Number(b.dataset.n);shown=false;lesson()});document.getElementById('reveal').onclick=()=>{if(shown){lessonN=lessonN===40?2:lessonN+2;shown=false}else shown=true;lesson()}}
function deck(mode){if(mode==='practice'){const weak=shuffle(all.filter(n=>(saved.errors[n]||0)>0)).sort((a,b)=>(saved.errors[b]||0)-(saved.errors[a]||0)).slice(0,4);return shuffle([...weak,...shuffle(all.filter(n=>!weak.includes(n))).slice(0,10-weak.length)])}return shuffle(all)}
function start(mode){stop();view='game';state={mode,queue:deck(mode),index:0,score:0,attempts:0,streak:0,input:'',locked:false,assisted:false,wrong:false,hint:false,missed:new Set(),deadline:mode==='timed'?Date.now()+60000:0};next();if(mode==='timed'){timer=setInterval(tick,100);tick()}}
function tick(){if(!state||state.mode!=='timed'||view!=='game')return;const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));const el=document.getElementById('clock');if(el)el.textContent='⏳ '+left+' s';const m=document.getElementById('meter');if(m)m.style.width=(left/60*100)+'%';if(left===0)finish()}
function next(){if(!state)return;if(state.mode==='timed'&&Date.now()>=state.deadline){finish();return}if(state.mode!=='timed'&&state.index>=modes[state.mode].count){finish();return}if(!state.queue.length){let d=shuffle(all);if(d[0]===state.n)[d[0],d[1]]=[d[1],d[0]];state.queue=d}state.n=state.queue.shift();state.index++;state.input='';state.locked=false;state.wrong=false;state.assisted=false;state.hint=false;render()}
function render(){const s=state, timed=s.mode==='timed',story=s.mode==='story';app.innerHTML=bar(modes[s.mode].title)+'<div class="bar"><span id="clock" class="stat">'+(timed?'⏳ '+Math.max(0,Math.ceil((s.deadline-Date.now())/1000))+' s':'Épreuve '+s.index+' / '+modes[s.mode].count)+'</span><span class="small">✨ '+s.score+' réussites · série '+s.streak+'</span></div><div class="meter"><span id="meter" style="width:'+(timed?Math.max(0,(s.deadline-Date.now())/60000*100):(s.index-1)/modes[s.mode].count*100)+'%"></span></div><div class="gamegrid"><section class="panel"><div class="question">'+(story?'<span class="story">'+stories[(s.index-1)%stories.length][0].replace('{n}',s.n)+'</span>':'<span class="prompt">La moitié de</span><strong class="number">'+s.n+'</strong>')+'</div><div id="helper" hidden></div><div class="answer" aria-label="Ta réponse"><span class="answer-box" id="answer">?</span>'+(story?'<span class="small">'+stories[(s.index-1)%stories.length][1]+'</span>':'')+'</div><div class="feedback" id="feedback" role="status">À toi de jouer !</div></section><section><div class="keypad" aria-label="Clavier numérique">'+[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>'<button data-key="'+k+'" '+(k==='✓'?'class="primary" aria-label="Valider"':k==='⌫'?'aria-label="Effacer"':'')+'>'+k+'</button>').join('')+'</div>'+(timed?'':'<button class="hint wide" id="hint" style="margin-top:8px">💡 Un petit indice</button>')+'</section></div>';wireHome();app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));const h=document.getElementById('hint');if(h)h.onclick=hint}
function hint(){if(!state||state.locked)return;state.assisted=true;state.hint=true;const n=state.n,helper=document.getElementById('helper');helper.hidden=false;helper.innerHTML=cauldrons(n)+'<p class="small">Compte les ingrédients d’un seul chaudron.</p>';document.getElementById('hint').disabled=true}
function key(k){if(view!=='game'||!state||state.locked)return;if(state.mode==='timed'&&Date.now()>=state.deadline){finish();return}if(k==='✓'){if(state.input!=='')submit();return}if(k==='⌫')state.input=state.input.slice(0,-1);else if(/^\d$/.test(k)&&state.input.length<2)state.input=(state.input==='0'?'':state.input)+k;document.getElementById('answer').textContent=state.input||'?'}
function feedback(msg,cls){const el=document.getElementById('feedback');el.textContent=msg;el.className='feedback '+cls}
function submit(){const s=state,n=s.n,ok=Number(s.input)===n/2,timed=s.mode==='timed';s.attempts++;if(ok){if(!s.wrong&&!s.assisted){s.score++;s.streak++;saved.xp+=10+(s.streak%5===0?5:0);saved.errors[n]=Math.max(0,(saved.errors[n]||0)-1)}else{s.streak=0;saved.xp+=3}store();s.locked=true;feedback('✨ Bravo ! '+n/2+' + '+n/2+' = '+n,'good');advance=setTimeout(next,timed?350:800)}else{s.streak=0;s.wrong=true;s.missed.add(n);saved.errors[n]=(saved.errors[n]||0)+1;store();if(timed){s.locked=true;feedback('La moitié de '+n+' est '+n/2+'.','retry');advance=setTimeout(next,550)}else{feedback('Pas tout à fait. Essaie encore !','retry');s.input='';document.getElementById('answer').textContent='?';hint()}}}
function finish(){if(!state||view!=='game')return;stop();view='result';const s=state,timed=s.mode==='timed',record=timed&&s.score>saved.best;if(record){saved.best=s.score;store()}const stars=timed?(s.score>=15?3:s.score>=8?2:1):(s.score===modes[s.mode].count?3:s.score>=modes[s.mode].count/2?2:1);app.innerHTML=bar('MISSION TERMINÉE')+'<section class="panel"><div class="result-stars" aria-label="'+stars+' étoiles">'+ '⭐'.repeat(stars)+'</div><h2>'+ (record?'Nouveau record !':'Mission accomplie !')+'</h2><div class="result-score">'+s.score+(timed?'':' / '+modes[s.mode].count)+'</div><p class="sub">Bonnes réponses du premier coup, sans indice'+(timed?' en 60 secondes':'')+'.</p><p class="badge-line">✦ '+saved.xp+' points · '+rank()+'</p>'+(s.missed.size?'<p class="sub">Sorts à revoir :</p><div class="review">'+[...s.missed].map(n=>'<span>'+n+' → '+n/2+'</span>').join('')+'</div>':'')+(timed?'<p class="sub">Record : '+saved.best+'</p>':'')+'<div class="controls" style="margin-top:15px"><button id="again" class="primary">Rejouer</button><button id="menu">Autres épreuves</button></div></section>';wireHome();document.getElementById('again').onclick=()=>start(s.mode);document.getElementById('menu').onclick=home}
document.addEventListener('keydown',e=>{if(view!=='game'||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='BUTTON'&&e.key==='Enter')return;if(/^\d$/.test(e.key)||e.key==='Enter'||e.key==='Backspace'){e.preventDefault();key(e.key==='Enter'?'✓':e.key==='Backspace'?'⌫':e.key)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
home();
</script></body></html>
